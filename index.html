<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicinlogg</title>
  <!-- Gun.js: peer-to-peer real-time database, no server needed -->
  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f0ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 80px;
    }

    h1 { font-size: 1.6rem; color: #3b1f6e; margin-bottom: 6px; }

    .subtitle {
      color: #7a6a99;
      font-size: 0.95rem;
      margin-bottom: 20px;
      text-align: center;
    }

    /* Sync bar */
    .sync-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      min-height: 22px;
    }

    .sync-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.82rem;
      color: #7a6a99;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.4s;
    }

    .sync-dot.ok      { background: #4caf50; }
    .sync-dot.syncing { background: #ffc107; animation: pulse 1s infinite; }
    .sync-dot.error   { background: #f44336; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    /* Share button */
    .share-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: #ede8ff;
      color: #5a3fa0;
      border: 1.5px solid #c9b8f0;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .share-btn:hover { background: #ddd6fa; }

    /* Card */
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(80, 40, 160, 0.1);
      padding: 28px 24px;
      width: 100%;
      max-width: 420px;
      margin-bottom: 24px;
    }

    .card h2 {
      font-size: 1rem;
      color: #5a3fa0;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 18px;
    }

    /* Medication checkboxes */
    .med-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }

    .med-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 2px solid #e8e0f8;
      border-radius: 12px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }

    .med-item:hover  { border-color: #b49ddf; background: #faf7ff; }
    .med-item.checked { border-color: #7c4dcc; background: #f0eaff; }

    .med-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #7c4dcc;
      cursor: pointer;
      flex-shrink: 0;
    }

    .med-name { font-size: 1.05rem; font-weight: 600; color: #2d1a55; }
    .med-last { font-size: 0.8rem; color: #9985c4; margin-top: 2px; }

    /* Time selector */
    .time-selector {
      background: #f8f4ff;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }

    .time-toggle { display: flex; gap: 8px; }

    .time-toggle button {
      flex: 1;
      padding: 8px;
      border: 2px solid #e0d4f8;
      border-radius: 8px;
      background: #fff;
      color: #7a6a99;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .time-toggle button.active {
      background: #7c4dcc;
      border-color: #7c4dcc;
      color: #fff;
    }

    .custom-time-row {
      display: none;
      margin-top: 12px;
      align-items: center;
      gap: 10px;
    }

    .custom-time-row.visible { display: flex; }

    .custom-time-row label {
      font-size: 0.85rem;
      color: #5a3fa0;
      font-weight: 600;
      white-space: nowrap;
    }

    .custom-time-row input[type="datetime-local"] {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid #d0c4f0;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #2d1a55;
      background: #fff;
      outline: none;
    }

    .custom-time-row input[type="datetime-local"]:focus { border-color: #7c4dcc; }

    .confirm-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background: #7c4dcc;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .confirm-btn:hover   { background: #6a3db8; }
    .confirm-btn:active  { transform: scale(0.98); }
    .confirm-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* Log section */
    .log-list { display: flex; flex-direction: column; }

    .log-entry {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1px solid #f0eaff;
      gap: 8px;
    }

    .log-entry:last-child { border-bottom: none; }
    .log-med  { font-weight: 600; color: #2d1a55; font-size: 0.95rem; }
    .log-time { font-size: 0.85rem; color: #7a6a99; white-space: nowrap; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #3b1f6e;
      color: #fff;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      transition: transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <h1>Medicinlogg</h1>
  <p class="subtitle">Välj medicin och bekräfta för att logga tidpunkten</p>

  <!-- Sync status + share -->
  <div class="sync-bar">
    <div class="sync-status">
      <div class="sync-dot syncing" id="syncDot"></div>
      <span id="syncText">Ansluter…</span>
    </div>
    <button class="share-btn" onclick="shareLink()">
      🔗 Dela länk
    </button>
  </div>

  <div class="card">
    <h2>Ge medicin</h2>
    <div class="med-list" id="medList"></div>

    <div class="time-selector">
      <div class="time-toggle">
        <button id="btnNow" class="active" onclick="setTimeMode('now')">Nu</button>
        <button id="btnCustom" onclick="setTimeMode('custom')">Annan tidpunkt</button>
      </div>
      <div class="custom-time-row" id="customTimeRow">
        <label for="customTime">Tid:</label>
        <input type="datetime-local" id="customTime" />
      </div>
    </div>

    <button class="confirm-btn" id="confirmBtn" disabled onclick="confirmDose()">
      Bekräfta given dos
    </button>
  </div>

  <div class="card">
    <h2>Senast givet</h2>
    <div class="log-list" id="logList"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const MEDS = [
      { id: "paracetamol", name: "Paracetamol 125mg" },
      { id: "ipren",       name: "Ipren 60mg" },
      { id: "antibiotika", name: "Antibiotika" },
    ];

    let timeMode  = "now";
    let cachedLog = {};
    let db;         // Gun.js node for this room
    let connected  = false;

    // ── Room ID ────────────────────────────────────────────────────────────
    // The room ID lives in the URL hash so sharing the URL = sharing access.
    function getRoomId() {
      const hash = window.location.hash.slice(1);
      if (hash && hash.length > 10) {
        localStorage.setItem("meds_room", hash);
        return hash;
      }
      let stored = localStorage.getItem("meds_room");
      if (!stored) {
        stored = crypto.randomUUID();
        localStorage.setItem("meds_room", stored);
      }
      history.replaceState(null, "", "#" + stored);
      return stored;
    }

    // ── Share ──────────────────────────────────────────────────────────────
    async function shareLink() {
      const url = window.location.href;
      if (navigator.share) {
        await navigator.share({ title: "Medicinlogg", url });
      } else if (navigator.clipboard) {
        await navigator.clipboard.writeText(url);
        showToast("Länk kopierad!");
      } else {
        prompt("Kopiera denna länk:", url);
      }
    }

    // ── Format time ────────────────────────────────────────────────────────
    function formatTime(isoString) {
      if (!isoString) return null;
      const d       = new Date(isoString);
      const now     = new Date();
      const diffMs  = now - d;
      const mins    = Math.floor(diffMs / 60000);
      const hours   = Math.floor(mins / 60);
      const days    = Math.floor(hours / 24);
      const timeStr = d.toLocaleTimeString("sv-SE", { hour: "2-digit", minute: "2-digit" });
      const dateStr = d.toLocaleDateString("sv-SE", { weekday: "short", day: "numeric", month: "short" });

      if (days === 0) {
        if (mins < 1)  return "Just nu";
        if (mins < 60) return `för ${mins} min sedan (${timeStr})`;
        return `idag ${timeStr} (${hours} tim sedan)`;
      }
      if (days === 1) return `igår ${timeStr}`;
      return `${dateStr} kl ${timeStr}`;
    }

    // ── Render ─────────────────────────────────────────────────────────────
    function renderMedList() {
      const container = document.getElementById("medList");
      const checked   = {};
      MEDS.forEach(m => {
        const el = document.getElementById("chk_" + m.id);
        if (el) checked[m.id] = el.checked;
      });

      container.innerHTML = "";
      MEDS.forEach(med => {
        const lastTime = cachedLog[med.id];
        const label    = document.createElement("label");
        label.className = "med-item" + (checked[med.id] ? " checked" : "");
        label.htmlFor   = "chk_" + med.id;

        const checkbox  = document.createElement("input");
        checkbox.type   = "checkbox";
        checkbox.id     = "chk_" + med.id;
        checkbox.checked = !!checked[med.id];
        checkbox.addEventListener("change", updateConfirmBtn);
        checkbox.addEventListener("change", () => label.classList.toggle("checked", checkbox.checked));

        const textDiv = document.createElement("div");

        const nameEl = document.createElement("div");
        nameEl.className   = "med-name";
        nameEl.textContent = med.name;

        const lastEl = document.createElement("div");
        lastEl.className   = "med-last";
        lastEl.textContent = lastTime
          ? "Senast: " + formatTime(lastTime)
          : "Ingen dos loggad ännu";

        textDiv.appendChild(nameEl);
        textDiv.appendChild(lastEl);
        label.appendChild(checkbox);
        label.appendChild(textDiv);
        container.appendChild(label);
      });
    }

    function renderLogList() {
      const container = document.getElementById("logList");
      container.innerHTML = "";
      MEDS.forEach(med => {
        const row = document.createElement("div");
        row.className = "log-entry";

        const medEl = document.createElement("span");
        medEl.className   = "log-med";
        medEl.textContent = med.name;

        const timeEl = document.createElement("span");
        timeEl.className   = "log-time";
        timeEl.textContent = cachedLog[med.id] ? formatTime(cachedLog[med.id]) : "–";

        row.appendChild(medEl);
        row.appendChild(timeEl);
        container.appendChild(row);
      });
    }

    function updateConfirmBtn() {
      const any = MEDS.some(m => document.getElementById("chk_" + m.id)?.checked);
      document.getElementById("confirmBtn").disabled = !any;
    }

    function setSyncState(state, text) {
      document.getElementById("syncDot").className = "sync-dot " + state;
      document.getElementById("syncText").textContent = text;
    }

    // ── Time mode ──────────────────────────────────────────────────────────
    function setTimeMode(mode) {
      timeMode = mode;
      document.getElementById("btnNow").classList.toggle("active", mode === "now");
      document.getElementById("btnCustom").classList.toggle("active", mode === "custom");
      const row = document.getElementById("customTimeRow");
      row.classList.toggle("visible", mode === "custom");
      if (mode === "custom") {
        const now = new Date();
        now.setSeconds(0, 0);
        document.getElementById("customTime").value =
          new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
      }
    }

    // ── Confirm dose ───────────────────────────────────────────────────────
    function confirmDose() {
      let timestamp;
      if (timeMode === "custom") {
        const val = document.getElementById("customTime").value;
        if (!val) { showToast("Ange en tidpunkt först"); return; }
        timestamp = new Date(val).toISOString();
      } else {
        timestamp = new Date().toISOString();
      }

      const given = [];
      MEDS.forEach(med => {
        const chk = document.getElementById("chk_" + med.id);
        if (chk?.checked) {
          given.push(med.name);
          chk.checked = false;
          // Write to Gun.js – all connected peers receive this instantly
          db.get(med.id).put({ time: timestamp });
        }
      });

      updateConfirmBtn();
      const label = timeMode === "custom" ? " (retroaktivt)" : "";
      showToast("Loggat: " + given.join(", ") + label);
    }

    // ── Toast ──────────────────────────────────────────────────────────────
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3000);
    }

    // ── Gun.js init ────────────────────────────────────────────────────────
    function initGun() {
      const roomId = getRoomId();

      const gun = Gun({
        peers: ["https://gun.eco/gun"],
        localStorage: true,
      });

      db = gun.get("medicinlogg/" + roomId);

      // Subscribe to each medicine's latest time
      MEDS.forEach(med => {
        db.get(med.id).on((data) => {
          if (data && data.time) {
            cachedLog[med.id] = data.time;
            renderMedList();
            renderLogList();
          }
          if (!connected) {
            connected = true;
            setSyncState("ok", "Synkad");
          }
        });
      });

      // Timeout: if no data after 3s, show offline/local state
      setTimeout(() => {
        if (!connected) {
          setSyncState("error", "Ingen synk – fungerar lokalt");
          renderMedList();
          renderLogList();
        }
      }, 3000);

      // Periodically update the relative timestamps
      setInterval(() => {
        renderMedList();
        renderLogList();
      }, 60000);
    }

    initGun();
  </script>
</body>
</html>
